# Configuración de Entorno de Desarrollo

# Infraestructura Local LLM
llm_provider: ollama
ollama_host: "127.0.0.1"
ollama_port: 11434

# Transcripción de Audio
whisper_backend: whisper.cpp

# Bases de Datos
# NOTA: Pendiente definir si se usará MongoDB o Redis.
# Por ahora configuramos endpoints base genéricos.
nosql_host: "127.0.0.1"
nosql_port: 27017 # Puerto por defecto de MongoDB

# Configuración de Watcher (Throttling)
watcher:
  debounce_ms: 1000
  max_concurrent_tasks: 2

log_level: debug
